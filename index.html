.cv{position:relative;height:290px}.ov{overflow-x:auto}

td.nm{max-width:230px;overflow:hidden;text-overflow:ellipsis}
td.bar{position:relative;min-width:105px;text-align:right}td.bar i{position:absolute;left:0;top:3px;bottom:3px;background:var(--ac);opacity:.25;border-radius:3px}td.bar b{position:relative}
td.ht{text-align:center;min-width:44px}th.sel{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}tr.sel td{font-weight:700}
.mr{margin-top:8px;font-size:12px}ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.lk{color:var(--ac);cursor:pointer;text-decoration:underline;font-weight:600}#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}#md.on{display:flex}#md .pn{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin:auto;width:min(1400px,100%);max-height:100%;display:flex;flex-direction:column;padding:12px 14px}#md .bd{overflow:auto}#md input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}td.tx{text-align:left}
.xb{float:right;margin:-4px 0 0}.xp{background:var(--ac)!important;color:#fff!important;border:1px solid var(--ac)!important}

.cd{animation:up .35s ease both;transition:box-shadow .2s,border-color .2s}.cd:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);border-color:var(--ac)}
.g>.cd:nth-child(2){animation-delay:.04s}.g>.cd:nth-child(3){animation-delay:.08s}.g>.cd:nth-child(4){animation-delay:.12s}.g>.cd:nth-child(5){animation-delay:.16s}.g>.cd:nth-child(n+6){animation-delay:.2s}
td.bar i{transform-origin:left;animation:gr .8s ease both}td.ht{animation:fi .8s ease both}tbody tr:hover td.tx,tbody tr:hover td.nm,tbody tr:hover td:first-child{background:rgba(127,127,127,.12)}
.lk{transition:opacity .15s}.lk:hover{opacity:.7}.tb button{transition:background .2s}#md.on .pn{animation:up .25s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fn{font-size:11.5px;color:var(--mu);line-height:1.5;margin-top:6px}
